<!-- Giao diện thật của console-web (docs/platform-ui, agent-platform@c6cba1d65). CSS cũ của prototype nằm trong @layer legacy: thua class component thật, thắng reset mặc định. -->
<style>
@layer legacy {
svg{display:inline-block;vertical-align:middle}

/* Layout: console-web Organization shell — 56px header, 18rem section rail, centred max-w-5xl pane.
   Tokens are the values in packages/ui/src/styles/theme.css (light @theme, dark .dark), same names. */
:root{
  --background:#ffffff; --foreground:#020817; --card:#ffffff; --popover:#ffffff;
  --border:#e5e5e5; --border-strong:#64748b; --input:#e5e5e5; --ring:#203bdc;
  --muted:#f1f5f9; --accent:#f1f5f9; --secondary:#f1f5f9;
  --text-primary:#020817; --text-secondary:#475569; --text-muted:#64748b; --text-placeholder:#94a3b8;
  --primary:#203bdc; --primary-hover:#1932b5; --primary-foreground:#ffffff;
  --success:#00c951; --success-strong:#15803d; --warning:#fd9a00; --warning-strong:#b45309; --danger:#dc2626;
  --sidebar:#f8fafc; --sidebar-hover:#ecf0f5; --sidebar-accent:#e2e8f0;
  /* brand ramp steps the app reaches for in light / dark pairs (bg-brand-50 · dark:bg-brand-500/15 …) */
  --brand-soft:#eef1fd; --brand-soft-ink:#1932b5; --brand-chip:#dde2fb; --brand-chip-ink:#1932b5; --brand-edge:#c2caf7;
  --nav-ink:#475569; --connector:#cbd5e1; --seg-2:#9aa8f0; --overlay:rgba(2,8,23,.45);
  --shadow-xs:0 1px 2px rgba(0,0,0,.05); --shadow-sm:0 1px 3px rgba(0,0,0,.10); --shadow-md:0 4px 6px rgba(0,0,0,.10);
  --shadow-lg:0 10px 15px rgba(0,0,0,.10); --shadow-xl:0 20px 25px rgba(0,0,0,.10);
  --radius-sm:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:12px;
  --z-raised:10; --z-overlay:50;
  --font:"Inter Variable","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono Variable","JetBrains Mono",ui-monospace,Consolas,monospace;
  /* short aliases used by the page script */
  --bg:var(--background); --fg:var(--text-primary); --fg2:var(--text-secondary); --fg3:var(--text-muted);
  --brand:var(--primary); --brand-hover:var(--primary-hover); --brand-50:var(--brand-soft); --brand-700:var(--brand-soft-ink);
  --brand-200:var(--brand-edge); --hover:var(--sidebar-hover); --accent-soft:var(--accent);
  --ok:var(--success-strong); --warn:var(--warning-strong);
  --ok-bg:color-mix(in srgb,var(--success) 12%,transparent);
  --warn-bg:color-mix(in srgb,var(--warning) 15%,transparent);
  --danger-bg:color-mix(in srgb,var(--danger) 10%,transparent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --background:#0b1220; --foreground:#e6eaf2; --card:#141d30; --popover:#141d30;
  --border:#ffffff26; --border-strong:#3a4864; --input:#ffffff26; --ring:#4356df;
  --muted:#1a2438; --accent:#1e2a41; --secondary:#1e2a41;
  --text-primary:#e6eaf2; --text-secondary:#9aa7bd; --text-muted:#7c8aa4; --text-placeholder:#7c8aa4;
  --primary:#4356df; --primary-hover:#6b7ce8;
  --success:#05df72; --success-strong:#05df72; --warning:#fdc700; --warning-strong:#fdc700; --danger:#fb2c36;
  --sidebar:#0f172a; --sidebar-hover:#1e2a41; --sidebar-accent:#1e2a41;
  --brand-soft:color-mix(in srgb,#4356df 15%,transparent); --brand-soft-ink:#9aa8f0;
  --brand-chip:color-mix(in srgb,#4356df 30%,transparent); --brand-chip-ink:#c2caf7; --brand-edge:color-mix(in srgb,#4356df 40%,transparent);
  --nav-ink:#cbd5e1; --connector:#3a4864; --seg-2:#6b7ce8; --overlay:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --background:#0b1220; --foreground:#e6eaf2; --card:#141d30; --popover:#141d30;
  --border:#ffffff26; --border-strong:#3a4864; --input:#ffffff26; --ring:#4356df;
  --muted:#1a2438; --accent:#1e2a41; --secondary:#1e2a41;
  --text-primary:#e6eaf2; --text-secondary:#9aa7bd; --text-muted:#7c8aa4; --text-placeholder:#7c8aa4;
  --primary:#4356df; --primary-hover:#6b7ce8;
  --success:#05df72; --success-strong:#05df72; --warning:#fdc700; --warning-strong:#fdc700; --danger:#fb2c36;
  --sidebar:#0f172a; --sidebar-hover:#1e2a41; --sidebar-accent:#1e2a41;
  --brand-soft:color-mix(in srgb,#4356df 15%,transparent); --brand-soft-ink:#9aa8f0;
  --brand-chip:color-mix(in srgb,#4356df 30%,transparent); --brand-chip-ink:#c2caf7; --brand-edge:color-mix(in srgb,#4356df 40%,transparent);
  --nav-ink:#cbd5e1; --connector:#3a4864; --seg-2:#6b7ce8; --overlay:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:14px/20px var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 50%,transparent)}
.app{height:100%;display:flex;flex-direction:column}
.spacer{flex:1}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* interactive elements transition (DESIGN §10: 150ms ease, press 80ms) */
.btn,.ibtn,.avbtn,.rail a,.railfoot,.tn,.tg,.seg button,.chip,.cn,.menu .mi,.crumbs button,.inp,.sw i{transition:color 150ms ease,background-color 150ms ease,border-color 150ms ease,box-shadow 150ms ease}
.btn:active{transform:scale(.98);transition-duration:80ms}

/* icons: Hugeicons-style 2px stroke; the 18px control tier is 20px below md */
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px} svg.i.xs{width:12px;height:12px}
@media(max-width:767px){svg.i:not(.s):not(.xs){width:20px;height:20px}}

/* shell header: h-14, border-b, bg-card, ghost back arrow, muted org tile, reach pill */
header.top{height:56px;flex:none;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--card);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
@media(min-width:640px){header.top{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}}
.top h1{font-size:14px;line-height:20px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:var(--radius-md);background:none;color:var(--text-primary);flex:none}
.ibtn:hover{background:var(--accent)}
.hlogo,.ulogo{display:grid;place-items:center;flex:none;background:var(--muted);color:var(--text-secondary)}
.hlogo{width:32px;height:32px;border-radius:var(--radius-lg)}
.ulogo{width:36px;height:36px;border-radius:var(--radius-md)}
.ulogo.big{width:48px;height:48px;border-radius:var(--radius-lg)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--muted);color:var(--text-secondary);font-size:12px;line-height:16px;font-weight:500;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:767px){.pill{display:none}}
.avbtn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 8px 2px 2px;border-radius:999px;color:var(--text-secondary)}
.avbtn:hover{background:var(--accent)}
.avt{display:flex;flex-direction:column;text-align:left}
.avt b{font-weight:500;font-size:13px;line-height:16px;color:var(--text-primary)}
.avt small{font-size:12px;line-height:16px;color:var(--text-secondary);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:36px;height:36px;border-radius:999px;background:var(--brand-chip);color:var(--brand-chip-ink);display:grid;place-items:center;font-size:12px;font-weight:500;flex:none}
.avbtn .av{width:28px;height:28px}
@media(max-width:639px){.avt,.avbtn>svg{display:none}.avbtn{padding:2px}}

/* section rail: no heading, h-9 rows, brand-tint pill is the whole active state, collapse row at the foot */
.body{flex:1;min-height:0;display:flex}
nav.rail{width:288px;flex:none;background:var(--sidebar);border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;
  padding-left:max(8px,env(safe-area-inset-left,0px))}
.rail a,.railfoot{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--radius-lg);color:var(--nav-ink);font-weight:500;text-decoration:none;border:0;background:none;width:100%;text-align:left}
.rail a:hover,.railfoot:hover{background:var(--sidebar-hover);color:var(--text-primary)}
.rail a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-soft-ink)}
.rail .lb{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railfoot{margin-top:auto}
nav.rail.c{width:64px;align-items:center}
.rail.c a,.rail.c .railfoot{width:36px;justify-content:center;padding:0}
.rail.c .lb{display:none}
main{flex:1;min-width:0;overflow-y:auto}
.pane{max-width:1024px;margin:0 auto;padding:16px 16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:640px){.pane{padding-top:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}}
@media(min-width:1024px){.pane{padding-top:32px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
@media(max-width:1023px){
  .body{flex-direction:column}
  nav.rail,nav.rail.c{width:auto;flex-direction:row;align-items:center;background:var(--card);border-right:0;border-bottom:1px solid var(--border);overflow-x:auto;gap:4px;
    padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px))}
  .rail a,.rail.c a{flex:none;width:auto;height:32px;padding:0 10px;gap:6px;justify-content:flex-start}
  .rail a svg,.rail.c a svg{width:16px;height:16px}
  .rail .lb,.rail.c .lb{display:inline;flex:none}
  .railfoot{display:none}
}

/* pane header */
.ph{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.ph h2{font-size:20px;line-height:28px;font-weight:600;margin:0}
.ph p{margin:4px 0 0;color:var(--text-secondary);max-width:672px;text-wrap:pretty}

/* buttons: 36 default · 32 sm · cancel = grey fill (secondary), never outline */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--radius-lg);border:1px solid transparent;font-weight:500;background:var(--primary);color:var(--primary-foreground);white-space:nowrap}
.btn:hover{background:var(--primary-hover)}
.btn.sec{background:var(--secondary);color:var(--text-primary)} .btn.sec:hover{background:var(--sidebar-accent)}
.btn.out{background:var(--card);border-color:var(--border);color:var(--text-primary);box-shadow:var(--shadow-xs)} .btn.out:hover{background:var(--accent)}
.btn.sm{height:32px;padding:0 10px;border-radius:var(--radius-md)}
.btn.dgh{background:transparent;color:var(--danger)} .btn.dgh:hover{background:var(--danger-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* fields: labels font-medium 14, input h-9 rounded-lg border-input, halo focus */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:14px;font-weight:500;color:var(--text-primary)}
.inp,select.inp{height:36px;border-radius:var(--radius-lg);border:1px solid var(--input);background:var(--card);padding:0 12px;width:100%;box-shadow:var(--shadow-xs)}
select.inp{padding-right:8px}
.inp::placeholder{color:var(--text-placeholder)}
.search{position:relative;max-width:288px;flex:1;min-width:180px}
.search svg{position:absolute;left:12px;top:10px;color:var(--text-muted)}
.search .inp{padding-left:36px}

/* badge: rounded-full, 12px/500 */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;background:var(--secondary);color:var(--text-secondary);white-space:nowrap}
.badge.brand{background:var(--brand-soft);color:var(--brand-soft-ink)}
.badge.out{background:var(--background);border:1px solid var(--border);font-weight:400}
.badge.ok{background:var(--ok-bg);color:var(--success-strong)} .badge.warn{background:var(--warn-bg);color:var(--warning-strong)} .badge.bad{background:var(--danger-bg);color:var(--danger)}

/* cards: border + shadow-xs + rounded-xl. People/unit/admin cards are one box (p-3, gap-2.5) */
.card{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-xl);box-shadow:var(--shadow-xs)}
.cardp{padding:16px}
.card.cardp.row{padding:12px;gap:10px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.list{display:flex;flex-direction:column;gap:12px;padding:16px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .t{min-width:0;flex:1}
.row .t small{display:block;color:var(--text-secondary);font-size:12px;line-height:16px;overflow-wrap:anywhere}
.muted-row{opacity:.62}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:16px;color:var(--text-secondary)}
.crumbs button{background:none;border:0;padding:0 2px;border-radius:var(--radius-sm);color:var(--text-secondary)}
.crumbs button:hover{color:var(--text-primary)}
.crumbs button[aria-current]{color:var(--text-primary);font-weight:400}
.crumbs svg{color:var(--text-muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sec-h h3{font-size:16px;line-height:24px;font-weight:600;margin:0}
hr.sep{border:0;border-top:1px solid var(--border);margin:20px 0}

/* FocusHeader: rounded-xl bg-muted/50, 48px mark, the pane's verbs on the right */
.fh{display:flex;align-items:center;gap:12px;border-radius:var(--radius-xl);background:color-mix(in srgb,var(--muted) 50%,transparent);padding:16px;margin-bottom:20px;flex-wrap:wrap}
.fh .ulogo.big{background:var(--card);box-shadow:var(--shadow-xs)}
.fh .t{flex:1;min-width:200px}
.fh .fn{display:flex;gap:2px 12px;align-items:center;flex-wrap:wrap}
.fh h2{font-size:18px;line-height:28px;margin:0;font-weight:600;min-width:0}
.fh p{margin:2px 0 0;font-size:13px;line-height:20px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.fh .src{font-size:12px;line-height:16px;color:var(--text-muted)}
.fh .acts{display:flex;gap:8px;flex-wrap:wrap}

/* empty state: dashed edge, bare glyph, one sentence, bg-muted/50 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border:1px dashed var(--border);background:color-mix(in srgb,var(--muted) 50%,transparent);border-radius:var(--radius-xl);padding:24px 16px;color:var(--text-secondary)}
.empty span{max-width:36rem;text-wrap:balance}

/* notices: filled slab, state carried by words and glyph as well as tint */
.note{display:flex;gap:10px;border-radius:var(--radius-lg);padding:10px 12px;background:var(--brand-soft);color:var(--text-primary);align-items:flex-start}
.note.warn{background:var(--warn-bg)} .note.bad{background:var(--danger-bg)} .note.ok{background:var(--ok-bg)}
.note svg{margin-top:1px}

/* tables: header row border-b only, rows separated by whitespace */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px;font:inherit}
th{text-align:left;font-weight:500;color:var(--text-secondary);font-size:12px;line-height:16px;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;vertical-align:middle}
tbody tr:hover{background:color-mix(in srgb,var(--muted) 50%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
th.num{font-family:var(--font);font-size:12px}

/* bars: brand fill; warning/danger fills only, never as text */
.bar{height:8px;border-radius:999px;background:var(--muted);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px}
.bar.hi>i{background:var(--warning)} .bar.full>i{background:var(--danger)}

/* segmented control (views): track h-8 rounded-md p-0.5 gap-0.5, segment h-7 rounded-sm; idle ink secondary */
.seg{display:inline-flex;align-items:center;gap:2px;align-self:flex-start;height:32px;padding:2px;border-radius:var(--radius-md);background:var(--muted)}
.seg button{height:28px;padding:0 10px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--text-secondary);font-weight:500}
.seg button:hover{color:var(--text-primary)}
.seg button[aria-pressed="true"]{background:var(--background);color:var(--text-primary);box-shadow:var(--shadow-xs)}
/* choice chips (a VALUE that gets saved is not a view): h-8 rounded-md px-4, brand-100 + a check when picked, no border */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 16px;border:0;border-radius:var(--radius-md);background:var(--muted);color:var(--text-secondary);font-weight:500}
.chip:hover:not(:disabled){background:var(--sidebar-accent)}
.chip[aria-pressed="true"]{background:var(--brand-chip);color:var(--brand-chip-ink)}
.chip .ck{display:none;margin-right:6px}
.chip[aria-pressed="true"] .ck{display:inline-grid}
.chip:disabled{cursor:not-allowed}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--connector)}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:999px;background:#fff;transition:transform 150ms ease}
.sw input:checked+i{background:var(--primary)} .sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 50%,transparent)}

.two{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.two{grid-template-columns:1.1fr .9fr}}

/* simulator: states are filled tints with words, not bordered boxes inside a card */
.chain{display:flex;flex-direction:column;gap:8px}
.lvl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:var(--radius-lg);background:color-mix(in srgb,var(--muted) 50%,transparent)}
.lvl .bar{grid-column:1/-1}
.lvl.pass{background:var(--ok-bg)} .lvl.fail{background:var(--danger-bg)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.steps div{border-radius:var(--radius-lg);padding:10px 6px;background:color-mix(in srgb,var(--muted) 50%,transparent)}
.steps b{display:block;font-size:20px;line-height:28px;font-weight:500;font-family:var(--mono)} .steps span{font-size:12px;line-height:16px;color:var(--text-secondary)}

/* master-detail + tree */
.ms{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.ms{grid-template-columns:288px minmax(0,1fr);align-items:start}.tree-col{position:sticky;top:0}}
.ms .two{grid-template-columns:1fr}
.treebox{border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card);box-shadow:var(--shadow-xs)}
.treebox>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:500}
.treebox>summary::-webkit-details-marker{display:none}
.tree-top{padding:4px 10px 8px;display:flex;flex-direction:column;gap:8px}
.tree-in{padding:4px 6px 10px;max-height:60vh;overflow:auto}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{padding-left:18px}
.trow{display:flex;align-items:center;gap:2px}
.tg,.tgs{width:24px;height:30px;flex:none;display:grid;place-items:center;background:none;border:0;border-radius:var(--radius-sm);color:var(--text-muted);padding:0}
.tg:hover{background:var(--accent)}
.tg svg{transition:transform 150ms ease}.tg.o svg{transform:rotate(90deg)}

function simRun(){
  var u=U[$('#su').value],a=AG[$('#sa').value],own=Q[a.owner];

   {n:u.name+' (cá nhân)',used:u.used,limit:u.limit,o:u},

   {n:Q.wallet.name,used:Q.wallet.used,limit:Q.wallet.limit,o:Q.wallet}].filter(function(c){return !c.skip});
  var failed=null,h='<div class="chain">';

    h+='<div class="lvl '+(ok?'pass':'fail')+'"><span><b style="font-weight:500">'+esc(c.n)+'</b></span><span class="badge '+(ok?'ok':'bad')+'">'+(ok?'đủ':'không đủ')+'</span>'+bar(c.used,c.limit)+'<span class="mono" style="grid-column:1/-1;font-size:12px;color:var(--fg2)">còn '+fmt(rem)+' · cần giữ tạm '+a.reserve+'</span></div>'});

function personBy(n){return PEOPLE.filter(function(p){return p.n===n})[0]}
function groupBy(n){return GROUPS.filter(function(g){return g.name===n})[0]}
function groupsOf(name){return GROUPS.filter(function(g){return !g.unit&&groupMembers(g).indexOf(name)>=0}).map(function(g){return g.name})}
function groupMembers(g){return g.unit?PEOPLE.filter(function(p){return p.units.some(function(u){return (pathTo(u)||[]).indexOf(g.unit)>=0})}).map(function(p){return p.n}):g.members.map(function(m){return m.replace(/\s*\(.*\)$/,'')})}
function allWho(){return PEOPLE.map(function(p){return ['user:'+p.n,p.n,'Người dùng']}).concat(GROUPS.map(function(g){return ['group:'+g.name,'Nhóm '+g.name,g.unit?'Nhóm động':'Nhóm']})).concat([['all','Mọi người','Hệ thống']])}
function whoBy(w){return allWho().filter(function(x){return x[0]===w})[0]||[w,w,'']}
function whoKind(w){return w.split(':')[0]}
function inWho(p,w){if(!w||w==='none')return false;if(w==='all')return true;var k=w.split(':')[0],v=w.slice(k.length+1);
  if(k==='group'){if(p.asGroup)return p.asGroup===v;var g=groupBy(v);
    if(g&&g.unit)return p.units.some(function(u){return (pathTo(u)||[]).indexOf(g.unit)>=0});
    return !!g&&groupMembers(g).indexOf(p.n)>=0}
  return p.n===v&&!p.asGroup}

/* ---------- đánh giá: deny trước, rồi hợp các role assignment, mặc định từ chối ---------- */
function evalAccess(p,perm,t){
  var res={dec:'none',deny:null,grants:[],skRole:[]};
  DENIES.forEach(function(d){
    if(res.deny||!d.on)return;
    if(!d.perms.some(function(x){return matchPerm(x,perm)}))return;
    if(!scMatch(d.scope,t)||!inWho(p,d.who)||inWho(p,d.except))return;
    res.deny=d});
  ASSIGN.forEach(function(a){
    if(!inWho(p,a.who)||!scMatch(a.scope,t))return;
    if(!roleHas(roleBy(a.role),perm)){res.skRole.push(a);return}
    res.grants.push(a)});
  res.dec=res.deny?'deny':res.grants.length?'allow':'none';return res}
function canWrite(p,perm,scope){return evalAccess(p,perm,scTarget(scope)).dec==='allow'}
function roleAssignableAt(r,scope){return r.at==='root'||scAnc(scope).indexOf(r.at)>=0}
/* Azure không có quy tắc tập con: ai có roleAssignments/write tại phạm vi thì gán được mọi vai trò,
   trừ khi role assignment cấp quyền đó có ràng buộc ủy quyền (vai trò nào, loại principal nào). */
function delegAllows(d,roleId,who){if(!d)return true;
  if(d.roles&&d.roles.indexOf(roleId)<0)return false;
  if(d.kinds&&who&&d.kinds.indexOf(whoKind(who))<0)return false;
  if(!d.roles&&isPriv(roleBy(roleId)))return false;
  return true}
function delegTxt(d){var o=[];if(d.roles)o.push('chỉ gán '+d.roles.map(function(x){return roleBy(x)?roleBy(x).name:x}).join(', '));else o.push('không gán vai trò quản trị đặc quyền');if(d.kinds&&d.kinds.length<2)o.push('chỉ cho '+(d.kinds[0]==='user'?'người dùng':'nhóm'));return 'Ràng buộc ủy quyền: '+o.join('; ')}
function grantCheck(p,roleId,scope,who){
  var e=evalAccess(p,GP,scTarget(scope));
  if(e.dec!=='allow')return {ok:false,why:e.dec==='deny'?'deny':'perm',deny:e.deny};
  var free=e.grants.filter(function(a){return delegAllows(a.deleg,roleId,who)});
  return free.length?{ok:true,why:''}:{ok:false,why:'deleg',via:e.grants}}
function grantWhy(c){return c.why==='deny'?'Bị chặn bởi «'+c.deny.name+'».':c.why==='perm'?'Bạn không có quyền gán vai trò tại phạm vi này.':c.via.map(function(a){return delegTxt(a.deleg)}).join('; ')+'.'}
function lastOwner(a){return a.role==='owner'&&a.scope==='root'&&ASSIGN.filter(function(x){return x.role==='owner'&&x.scope==='root'}).length<2}

function pAssign(){var me=actorP();
  var h=head('Phân quyền','Mỗi lượt gán vai trò gồm ba phần: ai, vai trò gì, ở phạm vi nào. Phạm vi mặc định là «Tất cả tài nguyên». Chọn nhóm tài nguyên hoặc tài nguyên khi cần hẹp hơn.',
    '<button class="btn" data-assign=""'+(canAssignAny(me)?'':' disabled title="Bạn không có quyền gán vai trò ở đâu"')+'>'+ic('plus','s')+'Gán vai trò</button>');
  var so=function(v,t){return '<option value="'+v+'"'+(aScope===v?' selected':'')+'>'+esc(t)+'</option>'};
  h+=toolbar(searchBox('qa',Qs.a,'Tìm người hoặc nhóm…')+
    '<select class="inp" id="aRole" aria-label="Lọc vai trò" style="width:auto;min-width:170px"><option value="all">Mọi vai trò</option>'+ROLEDEFS.map(function(r){return '<option value="'+r.id+'"'+(aRole===r.id?' selected':'')+'>'+esc(r.name)+'</option>'}).join('')+'</select>'+
    '<select class="inp" id="aScope" aria-label="Lọc phạm vi" style="width:auto;min-width:170px">'+so('all','Mọi phạm vi')+so('root','Tất cả tài nguyên')+'<optgroup label="Nhóm tài nguyên">'+COLLS.map(function(c){return so('coll:'+c.id,c.name)}).join('')+'</optgroup><optgroup label="Tài nguyên">'+RES.map(function(r){return so('res:'+r.id,r.name)}).join('')+'</optgroup></select>');
  var rows=ASSIGN.filter(function(a){return mq(Qs.a,whoBy(a.who)[1])&&(aRole==='all'||a.role===aRole)&&(aScope==='all'||a.scope===aScope)}).sort(function(x,y){return scOrd(x.scope)-scOrd(y.scope)||scLabel(x.scope).localeCompare(scLabel(y.scope))||whoBy(x.who)[1].localeCompare(whoBy(y.who)[1])});
  h+='<p style="color:var(--fg2);font-size:13px;margin:0 0 8px" id="acount">'+rows.length+' / '+ASSIGN.length+' lượt gán vai trò</p>';
  h+='<div class="tw"><table style="min-width:760px"><thead><tr><th style="min-width:200px">Ai</th><th>Vai trò</th><th style="min-width:220px">Phạm vi</th><th>Ràng buộc</th><th></th></tr></thead><tbody>';
  rows.forEach(function(a){var ro=roleBy(a.role),p=scParse(a.scope),can=!lastOwner(a)&&grantCheck(me,a.role,a.scope,a.who).ok,isG=whoKind(a.who)==='group';
    h+='<tr data-arow="'+a.id+'"><td><div class="row"><span class="av">'+(isG?ic('users','xs'):ini(whoBy(a.who)[1]))+'</span><span class="t"><button class="lnk" data-dr="'+esc(a.who)+'"><b style="font-weight:500">'+esc(whoBy(a.who)[1])+'</b></button><small>'+(isG?'Nhóm':'Người dùng')+'</small></span></div></td>'+
      '<td><button class="lnk" data-dr="role:'+a.role+'"><span class="rchip'+(ro.type==='custom'?' brand':privGroup(ro)?' warn':'')+'">'+esc(ro.name)+'</span></button></td>'+
      '<td><div class="row"><span class="ulogo" style="width:28px;height:28px">'+ic(placeIcon(a.scope),'xs')+'</span><span class="t"><button class="lnk" data-dr="'+placeDr(a.scope)+'"><b style="font-weight:500">'+esc(scLabel(a.scope))+'</b></button><small>'+(p.k==='root'?'Tổ chức':p.k==='coll'?'Nhóm tài nguyên':RTN[resBy(p.id).t]+' trong '+esc(tagNames(resBy(p.id))))+'</small></span></div></td>'+
      '<td style="color:var(--fg2);font-size:12px">'+(a.deleg?esc(delegTxt(a.deleg)):'–')+'</td>'+
      '<td style="text-align:right">'+(lastOwner(a)?'<span class="badge out">Owner cuối cùng</span>':can?'<button class="btn dgh sm" data-delas="'+a.id+'">Thu hồi</button>':'<span style="color:var(--fg3)" title="'+esc(grantWhy(grantCheck(me,a.role,a.scope,a.who)))+'">'+ic('lock','xs')+'</span>')+'</td></tr>'});
  if(!rows.length)h+='<tr><td colspan="5"><div class="empty">'+ic('search')+'<span>Không có lượt gán nào khớp.</span></div></td></tr>';
  return h+'</tbody></table></div>'}

/* ==================== Bổ sung mô hình cho giao diện kiểu Frontegg ==================== */
function scLabel(s){return s==='root'?'Tất cả tài nguyên':scName(s)}
function scShort(s){var p=scParse(s);return p.k==='root'?'':scName(s)}
function scTag(s){var p=scParse(s);return p.k==='root'?'Tất cả tài nguyên':p.k==='coll'?'Nhóm tài nguyên '+scName(s):RTN[resBy(p.id).t]+' '+scName(s)}
function scopeOptions(me,sel){
  var ok=function(s){return canWrite(me,GP,s)};
  var h=ok('root')?'<option value="root"'+(sel==='root'?' selected':'')+'>Tất cả tài nguyên</option>':'';
  var cs=COLLS.filter(function(c){return ok('coll:'+c.id)});
  if(cs.length)h+='<optgroup label="Nhóm tài nguyên">'+cs.map(function(c){return '<option value="coll:'+c.id+'"'+(sel==='coll:'+c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</optgroup>';
  var rs=RES.filter(function(r){return ok('res:'+r.id)});
  if(rs.length)h+='<optgroup label="Tài nguyên">'+rs.map(function(r){return '<option value="res:'+r.id+'"'+(sel==='res:'+r.id?' selected':'')+'>'+esc(r.name)+' · '+esc(tagNames(r))+'</option>'}).join('')+'</optgroup>';
  return h}
function emailOf(n){var e='';allNodes(TREE).forEach(function(u){(u.people||[]).forEach(function(p){if(p.n===n)e=p.e})});return e||slug(n)+'@b.vn'}
function userGroups(p){return GROUPS.filter(function(g){return inWho(p,'group:'+g.name)})}
function roleChip(a,pk){var ro=roleBy(a.role),via=a.who!==pk&&whoKind(a.who)==='group';
  return '<span class="rchip'+(ro.type==='custom'?' brand':privGroup(ro)?' warn':'')+'" title="'+esc(ro.name+' · '+scTag(a.scope)+(via?' · qua nhóm '+a.who.slice(6):''))+'">'+(via?ic('users','xs'):'')+esc(ro.name)+(a.scope==='root'?'':'<em>· '+esc(scShort(a.scope))+'</em>')+'</span>'}
function chipsMax(arr,n){return arr.slice(0,n).join('')+(arr.length>n?'<span class="rchip out">+'+(arr.length-n)+'</span>':'')}
function permKindBadge(id){return isData(id)?'<span class="badge ok">sử dụng</span>':'<span class="badge out">quản lý</span>'}
function dataHint(e,perm){return isData(perm)&&e.skRole.some(function(a){return roleBy(a.role).perms.indexOf('*')>=0})?' Đây là quyền sử dụng: Owner và Contributor chỉ có quyền quản lý. Cần thêm một vai trò có quyền sử dụng, ví dụ EOS Resource User.':''}
function viewBtn(w){return '<button class="btn sec sm" data-dr="'+esc(w)+'">'+ic('key','s')+'Xem quyền</button>'}
function unitViewBtn(id){var g=GROUPS.filter(function(x){return x.unit===id})[0];return g?viewBtn('group:'+g.name):''}
function cntAllow(perm,r){return PEOPLE.filter(function(p){return evalAccess(p,perm,{k:'res',id:r.id}).dec==='allow'}).length}
function usePerm(r){return r.t==='agent'?'agent/run':USEPERM[r.t]}

var SUB={bi:'tien',dp:'kenh',pr:'bygroup',ro:'matrix'};
function subSeg(k,items){return '<div class="seg" role="group" aria-label="Mục con" style="margin-bottom:16px">'+items.map(function(i){return '<button data-sub="'+k+':'+i[0]+'" aria-pressed="'+(SUB[k]===i[0])+'">'+i[1]+'</button>'}).join('')+'</div>'}
function pCoCau(){return pCoCauUnits()}
function pTien(){return subSeg('bi',[['tien','Tổng quan và chạy thử'],['phanbo','Phân bổ hạn mức']])+(SUB.bi==='phanbo'?pPhanBo():pVi())}
function pTrienKhai(){return subSeg('dp',[['kenh','Kênh'],['agent','Chia sẻ agent ra ngoài']])+(SUB.dp==='agent'?pAgent():pKenh())}
function toolbar(inner){return '<div class="toolbar">'+inner+'</div>'}
function searchBox(id,val,ph){return '<div class="search">'+ic('search','s')+'<input class="inp" id="'+id+'" data-q="'+id+'" value="'+esc(val)+'" placeholder="'+ph+'" aria-label="'+ph+'"></div>'}
var Qs={u:'',g:'',r:'',p:'',rs:'',d:'',a:''},uUnit='all',pcat='all',rst='all',rsg='all',rsel=[];
function mq(q,txt){return !q||txt.toLowerCase().indexOf(q.trim().toLowerCase())>=0}

  h+=toolbar(searchBox('qu',Qs.u,'Tìm theo tên hoặc email…')+'<select class="inp" id="uUnit" style="width:auto;min-width:160px"><option value="all">Mọi phòng ban</option>'+allNodes(TREE).map(function(n){return '<option value="'+n.id+'"'+(uUnit===n.id?' selected':'')+'>'+'&nbsp;&nbsp;'.repeat(pathTo(n.id).length-1)+esc(n.name)+'</option>'}).join('')+'</select>');
  var rows=PEOPLE.filter(function(p){return mq(Qs.u,p.n+' '+emailOf(p.n))&&(uUnit==='all'||p.units.some(function(u){return (pathTo(u)||[]).indexOf(uUnit)>=0}))});
  h+='<div class="tw"><table style="min-width:760px"><thead><tr><th style="min-width:200px">Người</th><th>Phòng ban</th><th>Nhóm</th><th style="min-width:220px">Có quyền ở</th><th>Quản trị cơ cấu</th></tr></thead><tbody>';

  if(!rows.length)h+='<tr><td colspan="5"><div class="empty">'+ic('users')+'<span>Không có người nào khớp.</span></div></td></tr>';
  return h+'</tbody></table></div>'}
function inviteDlg(){
  var me=actorP(),units=allNodes(TREE).filter(function(n){return dirCan(me.n,'dir/members/write',n.id)});
  if(!units.length){toast('Bạn cần Org Admin hoặc Dept Admin để mời người');return}
  var gs=GROUPS.filter(function(g){return !g.unit&&canEditGroup(me.n,g)});
  var body='<div class="field"><label for="ie">Email</label><input class="inp" id="ie" placeholder="ten@congty.vn"></div>'+
   '<div class="field"><label for="iu">Phòng ban</label><select class="inp" id="iu">'+units.map(function(n){return '<option value="'+n.id+'">'+'&nbsp;&nbsp;'.repeat(pathTo(n.id).length-1)+esc(n.name)+'</option>'}).join('')+'</select></div>'+
   (gs.length?'<div class="field"><label for="ig">Thêm vào nhóm (không bắt buộc, chọn nhiều bằng Ctrl)</label><select class="inp" id="ig" multiple size="4" style="height:auto">'+gs.map(function(g){return '<option>'+esc(g.name)+'</option>'}).join('')+'</select></div>':'')+
   '<div class="note">'+ic('info','s')+'<span>Người mới có ngay quyền của nhóm động theo phòng ban và của các nhóm bạn chọn. Muốn cấp thêm, vào Phân quyền và bấm Gán vai trò.</span></div><div id="ierr" aria-live="polite"></div>';
  dlg('Mời người dùng','Người được mời đăng nhập bằng SSO và vào phòng ban đã chọn.',body,'Gửi lời mời',function(){
    var e=$('#ie').value.trim();if(!e||e.indexOf('@')<0){errNote('ierr','Nhập email hợp lệ.');return false}
    var nm=e.split('@')[0],u=$('#iu').value;if(personBy(nm)){errNote('ierr','Người này đã có trong tổ chức.');return false}
    var node=find(pathTo(u));node.people.push({n:nm,e:e,r:'Thành viên'});PEOPLE.push({n:nm,units:[u],groups:[]});
    if($('#ig'))[].forEach.call($('#ig').selectedOptions,function(o){groupBy(o.value).members.push(nm)});
    toast('Đã mời '+e);render();drawerOpen('user',nm,'roles')});
}

/* ==================== nhóm tài nguyên như tag ==================== */
var DEMO_TAGS={cn3:['c1','c5'],kb3:['c3','c5'],md1:['c8','c1']};
function tagsOf(r){if(!r)return [];if(!r.colls)r.colls=DEMO_TAGS[r.id]&&r.coll===DEMO_TAGS[r.id][0]?DEMO_TAGS[r.id].slice():(r.coll?[r.coll]:[]);return r.colls}
function inColl(r,cid){return tagsOf(r).indexOf(cid)>=0}
function setTag(r,cid,on){var t=tagsOf(r),i=t.indexOf(cid);if(on&&i<0)t.push(cid);if(!on&&i>=0)t.splice(i,1);r.coll=t[0]}
function tagNames(r){var t=tagsOf(r);return t.length?t.map(function(c){var x=collBy(c);return x?x.name:c}).join(', '):'chưa thuộc nhóm nào'}
function tagLinks(r){return tagsOf(r).map(function(c){return '<button class="lnk" data-dr="coll:'+c+'">'+esc(collBy(c).name)+'</button>'}).join(', ')}
function otherTags(r,cid){var o=tagsOf(r).filter(function(c){return c!==cid});return o.length?'Cũng thuộc '+o.map(function(c){return '«'+esc(collBy(c).name)+'»'}).join(', '):''}
/* gắn hoặc gỡ nhóm = đổi quyền: cần sửa được tài nguyên và sửa được nhóm đó */
function tagWhy(me,r,cid,removing){
  if(removing&&tagsOf(r).length<2&&inColl(r,cid))return 'Mỗi tài nguyên cần ít nhất một nhóm.';
  if(evalAccess(me,r.t+'/write',{k:'res',id:r.id}).dec!=='allow')return 'Cần quyền Sửa '+RTN[r.t].toLowerCase()+' này.';
  if(!canWrite(me,'rg/write','coll:'+cid))return 'Cần quyền sửa nhóm «'+collBy(cid).name+'».';
  return ''}
function scAnc(s){var p=scParse(s),o=['root'];if(p.k==='root')return o;if(p.k==='coll')o.push(s);
  if(p.k==='res'){tagsOf(resBy(p.id)).forEach(function(c){o.push('coll:'+c)});o.push(s)}return o}
function scMatch(s,t){var p=scParse(s);if(p.k==='root')return true;
  if(p.k==='coll')return (t.k==='coll'&&t.id===p.id)||(t.k==='res'&&inColl(resBy(t.id),p.id));
  return t.k==='res'&&t.id===p.id}
function resIn(s){var p=scParse(s);return RES.filter(function(r){return p.k==='root'||(p.k==='coll'&&inColl(r,p.id))||(p.k==='res'&&r.id===p.id)})}

/* ==================== engine: credential kế thừa từ connector ==================== */
function tagsOf(r){if(!r)return [];if(r.parent)return tagsOf(resBy(r.parent));if(!r.colls)r.colls=DEMO_TAGS[r.id]&&r.coll===DEMO_TAGS[r.id][0]?DEMO_TAGS[r.id].slice():(r.coll?[r.coll]:[]);return r.colls}
function inColl(r,cid){return !!r&&!r.parent&&tagsOf(r).indexOf(cid)>=0}
function inTree(r,cid){return tagsOf(r).indexOf(cid)>=0}
function tagWhy(me,r,cid,removing){
  if(r.parent)return 'Credential đi theo nhóm của connector «'+resBy(r.parent).name+'».';
  if(removing&&tagsOf(r).length<2&&inColl(r,cid))return 'Mỗi tài nguyên cần ít nhất một nhóm.';
  if(evalAccess(me,r.t+'/write',{k:'res',id:r.id}).dec!=='allow')return 'Cần quyền Sửa '+RTN[r.t].toLowerCase()+' này.';
  if(!canWrite(me,'rg/write','coll:'+cid))return 'Cần quyền sửa nhóm «'+collBy(cid).name+'».';
  return ''}
function scAnc(s){var p=scParse(s),o=['root'];if(p.k==='root')return o;if(p.k==='coll')o.push(s);
  if(p.k==='res'){var r=resBy(p.id);tagsOf(r).forEach(function(c){o.push('coll:'+c)});if(r&&r.parent)o.push('res:'+r.parent);o.push(s)}return o}
function scMatch(s,t){var p=scParse(s);if(p.k==='root')return true;
  if(p.k==='coll')return (t.k==='coll'&&t.id===p.id)||(t.k==='res'&&inTree(resBy(t.id),p.id));
  return t.k==='res'&&(t.id===p.id||resBy(t.id).parent===p.id)}
function resIn(s){var p=scParse(s);return RES.filter(function(r){return p.k==='root'||(p.k==='coll'&&inTree(r,p.id))||(p.k==='res'&&(r.id===p.id||r.parent===p.id))})}
function afSrc(T,x){if(T.indexOf('res:'+x.id)>=0)return 'chọn trực tiếp';
  if(x.parent&&T.indexOf('res:'+x.parent)>=0)return 'kế thừa từ connector «'+resBy(x.parent).name+'»';
  var cs=tagsOf(x).filter(function(c){return T.indexOf('coll:'+c)>=0});if(cs.length)return 'kế thừa từ nhóm '+cs.map(function(c){return '«'+collBy(c).name+'»'}).join(', ');
  if(T.indexOf('root')>=0)return 'kế thừa từ «Tất cả tài nguyên»';return ''}

function inWho(p,w){if(!w||w==='none')return false;if(Array.isArray(w))return w.some(function(x){return inWho(p,x)});if(w==='all')return true;
  var k=w.split(':')[0],v=w.slice(k.length+1);
  if(p.asAgent)return k==='agent'&&v===p.asAgent;
  if(k==='agent')return false;
  if(k==='group'){if(p.asGroup)return p.asGroup===v;var g=groupBy(v);
    if(g&&g.unit)return p.units.some(function(u){return (pathTo(u)||[]).indexOf(g.unit)>=0});
    return !!g&&groupMembers(g).indexOf(p.n)>=0}
  return p.n===v&&!p.asGroup}
function allWho(){return PEOPLE.map(function(p){return ['user:'+p.n,p.n,'Người dùng']})
  .concat(GROUPS.map(function(g){return ['group:'+g.name,'Nhóm '+g.name,g.unit?'Nhóm động':'Nhóm']}))
  .concat(agents().map(function(r){return ['agent:'+r.id,'Danh tính '+r.name,'Danh tính agent']}))
  .concat([['all','Mọi người','Hệ thống']])}
function evalAccess(p,perm,t){
  var res={dec:'none',deny:null,grants:[],skRole:[],skCond:[]};
  DENIES.forEach(function(d){
    if(res.deny||!d.on)return;
    if(!d.perms.some(function(x){return matchPerm(x,perm)}))return;
    if(!scMatch(d.scope,t)||!inWho(p,d.who)||inWho(p,d.except))return;
    if(d.cond&&!condOk(d.cond,t))return;
    res.deny=d});
  ASSIGN.forEach(function(a){
    if(!inWho(p,a.who)||!scMatch(a.scope,t))return;
    if(!roleHas(roleBy(a.role),perm)){res.skRole.push(a);return}
    if(a.cond&&!condOk(a.cond,t)){res.skCond.push(a);return}
    res.grants.push(a)});
  res.dec=res.deny?'deny':res.grants.length?'allow':'none';return res}
kPr=(function(o){return function(w){if(w.indexOf('agent:')===0){var id=w.slice(6),r=resBy(id);return {p:agentP(id),name:'Danh tính '+(r?r.name:id),type:'Danh tính agent',icon:'bot',sub:'',note:''}}return o(w)}})(kPr);
explainHtml=(function(o){return function(p,perm,t,tname){var h=o(p,perm,t,tname),e=evalAccess(p,perm,t);
  if(e.skCond.length)h+='<div class="note warn" style="margin-top:8px">'+ic('tag','s')+'<span><b>Điều kiện không thỏa</b> (AC-06). '+e.skCond.map(function(a){return '«'+esc(roleBy(a.role).name)+'» tại '+esc(scLabel(a.scope))+' kèm điều kiện '+esc(condTxt(a.cond))}).join('; ')+', nên lượt gán không có hiệu lực trên «'+esc(tname)+'»'+(t.k==='res'&&resLabels(resBy(t.id)).length?' (nhãn: '+esc(resLabels(resBy(t.id)).join(', '))+')':'')+'.</span></div>';
  if(e.deny&&e.deny.cond)h+='<div class="afhint">Quy định chặn có điều kiện: '+esc(condTxt(e.deny.cond))+'.</div>';
  return h}})(explainHtml);
